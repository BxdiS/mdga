name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --check packages/installer/src/templates/mdga_preload.js
      - run: node --check packages/installer/src/templates/mdga_main.js
      - run: npx tsx scripts/check-bundles.mts
