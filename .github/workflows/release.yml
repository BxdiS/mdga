name: release

# Publishes a release named after the commit, "build <sha7>", tagged
# build-<sha7>. Older builds stay in the release history; the newest build of
# main is marked latest, so the install command fetches it:
#   irm https://github.com/BxdiS/mdga/releases/latest/download/install.ps1 | iex
#
# When: every 3 days on a schedule, only if main moved since the last build;
# or by hand (Actions > release > Run workflow, or `gh workflow run
# release.yml`), which always builds. A `ref` input builds another commit;
# that release is not marked latest unless the ref is main's head.
on:
  schedule:
    - cron: "0 12 */3 * *" # 12:00 UTC on days 1, 4, 7, ... of each month
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build (default main)
        required: false
        default: main

permissions:
  contents: write
  # actions/attest-build-provenance: signs the assets so the release page
  # shows them as verified (gh attestation verify install.ps1 --repo BxdiS/mdga).
  attestations: write
  id-token: write

# Two quick merges must not interleave tag pushes and uploads.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REF: ${{ inputs.ref || github.sha }}

jobs:
  # Scheduled runs skip when nothing landed on main since the last build.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          last=$(git describe --tags --abbrev=0 --match 'build-*' HEAD 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ -z "$last" ]; then build=true
          elif [ "$(git rev-parse "$last^{commit}")" = "$(git rev-parse HEAD)" ]; then build=false
          else build=true; fi
          echo "last build: ${last:-none}, build: $build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # mdga-installer.exe needs the C# compiler that ships with Windows. Commits
  # from before the exe existed build without it.
  exe:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      # actions/checkout only fetches full SHAs or branch/tag names, so a
      # short hash like ba5d8ab fails there; fetch everything and switch here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout --quiet "$env:REF"
      - shell: pwsh
        run: |
          if (Test-Path scripts/exe/build.ps1) {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/exe/build.ps1 -Out dist/mdga-installer.exe
          } else { Write-Host "no scripts/exe at this commit, skipping the exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/mdga-installer.exe
          if-no-files-found: ignore

  release:
    needs: [check, exe]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the notes range
      - run: git checkout --quiet "$REF"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx scripts/check-bundles.mts

      - id: build
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - run: npx tsx scripts/build-release.mts
        env:
          MDGA_VERSION: ${{ steps.build.outputs.short }}
      - uses: actions/download-artifact@v4
        continue-on-error: true # absent for commits before the exe
        with:
          name: exe
          path: dist/release

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/*

      # Notes cover the commits since the nearest earlier build.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'build-*' HEAD^ 2>/dev/null || true)
          [ -n "$prev" ] && prev=$(git rev-parse "$prev^{commit}")
          bash scripts/release-notes.sh "$GITHUB_REPOSITORY" "$prev" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${{ steps.build.outputs.short }}
          tag="build-$short"
          git tag -f "$tag"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
            gh release edit "$tag" --title "build $short" --notes-file notes.md --latest=${{ steps.build.outputs.latest }}
          else
            gh release create "$tag" dist/release/* --title "build $short" --notes-file notes.md --latest=${{ steps.build.outputs.latest }}
          fi
